version: 2
updates:
  # Every action in ci.yml and release.yml is pinned to a commit SHA, which
  # stops a tag from being silently re-pointed — but also freezes them there
  # forever. This is the other half of that trade: Dependabot moves the pins
  # forward and rewrites the trailing `# vX.Y.Z` comment with them.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
    groups:
      # One PR for the routine churn; a breaking major still arrives on its
      # own so it gets read.
      minor-and-patch:
        update-types: ["minor", "patch"]
