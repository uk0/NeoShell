[package]
name = "neoshell"
version = "0.7.0"
edition = "2021"
description = "NeoShell launcher — thin binary that dlopen's neoshell-core"

[[bin]]
name = "neoshell"
path = "src/main.rs"

[dependencies]
libloading = "0.8"
dirs = "7"

# Update authenticity: the launcher re-verifies the detached ed25519 signature
# of a staged core library before installing it. Kept deliberately minimal —
# both crates are leaf dependencies with no transitive weight of their own.
ed25519-dalek = { version = "2", default-features = false, features = ["std"] }
base64 = "0.22"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
